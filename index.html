<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>備份與恢復控制台</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="備份控制台">
<meta name="theme-color" content="#182625">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#182625; --panel:#213533; --panel-2:#26403d; --panel-line:#33504c;
    --gold:#c9a961; --gold-dim:#8f8055; --red:#a8483f; --teal:#5aa3a3;
    --cream:#f0e9d8; --muted:#92a6a2;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--cream);
    font-family:'Noto Sans TC',sans-serif;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:40px 22px 150px; }
  @media (max-width:720px){ .wrap{ padding:20px 12px 150px; } }

  /* 標題區 */
  .masthead{
    text-align:center; border-bottom:1px solid var(--panel-line);
    padding-bottom:18px; margin-bottom:22px;
  }
  .masthead h1{
    font-weight:900; font-size:52px; letter-spacing:2px; margin:0;
  }
  @media (max-width:720px){ .masthead h1{ font-size:40px; } }
  .masthead p{ margin:8px 0 0; color:var(--muted); font-size:13px; letter-spacing:1px; line-height:1.7; }

  /* 提示 */
  .notes{
    border-left:3px solid var(--gold-dim); background:var(--panel);
    padding:10px 14px; font-size:12.5px; color:var(--muted); line-height:1.8;
    border-radius:0 6px 6px 0; margin-bottom:22px;
  }
  .notes b{ color:var(--gold); font-weight:500; }

  /* 工具列 */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .count{ font-size:13px; color:var(--muted); }
  .count b{ color:var(--gold); font-size:18px; font-weight:700; margin:0 2px; }
  .toolbar .btns{ display:flex; gap:8px; }
  .chip{
    background:var(--panel-2); border:1px solid var(--panel-line); color:var(--cream);
    padding:6px 14px; border-radius:6px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  .chip:hover{ border-color:var(--gold); color:var(--gold); }

  /* 項目列：仿萬年曆的日列 */
  .row{
    display:flex; align-items:center; gap:18px; padding:16px 6px;
    border-bottom:1px solid var(--panel-line); cursor:pointer; position:relative;
  }
  .row:hover{ background:rgba(201,169,97,0.05); }
  .row input{ position:absolute; opacity:0; width:1px; height:1px; }
  .badge{
    width:64px; height:64px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:'ZCOOL QingKe HuangYou','Noto Serif TC',serif; font-size:38px;
    color:var(--cream); border:1px solid var(--panel-line);
    transition:background .2s, color .2s, border-color .2s;
  }
  .row input:checked + .badge{ background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .row input:focus-visible + .badge{ outline:2px solid var(--teal); outline-offset:3px; }
  .row .info{ flex:1; min-width:0; }
  .row .name{ font-size:18px; font-weight:700; letter-spacing:1px; }
  .row .desc{ font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.6; }
  .row .file{ font-size:11px; color:var(--gold-dim); margin-top:3px; word-break:break-all; }
  .row .mark{
    font-size:12px; color:var(--panel-line); flex:0 0 auto; transition:color .2s;
  }
  .row input:checked ~ .mark{ color:var(--gold); }

  /* 執行結果 */
  .result{
    display:none; margin-top:22px; background:var(--panel); border:1px solid var(--panel-line);
    border-radius:8px; padding:16px 18px; line-height:1.9; font-size:14px;
  }
  .result.show{ display:block; }
  .result h2{ font-size:15px; margin:0 0 6px; color:var(--gold); font-weight:700; letter-spacing:1px; }
  .result p{ margin:0 0 8px; color:var(--muted); font-size:13px; }
  .result a{
    display:block; padding:8px 0; color:var(--cream); font-weight:700; text-decoration:none;
    border-bottom:1px dashed var(--panel-line);
  }
  .result a:last-of-type{ border-bottom:none; }
  .result a:hover{ color:var(--gold); }
  .result a.done{ color:var(--muted); opacity:.55; font-weight:400; }
  .result .tail{ margin:10px 0 0; }

  /* 底部操作列 */
  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:rgba(24,38,37,0.96); border-top:1px solid var(--panel-line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  }
  .bottom-inner{ max-width:920px; margin:0 auto; display:flex; gap:12px; }
  .bottom-bar button{
    flex:1; padding:14px 0; border-radius:8px; font-family:inherit; font-size:16px;
    font-weight:700; letter-spacing:2px; cursor:pointer;
  }
  #btn-backup{ background:var(--gold); color:var(--bg); border:1px solid var(--gold); }
  #btn-backup:hover{ background:#d8ba74; }
  #btn-restore{ background:transparent; color:var(--teal); border:1px solid var(--teal); }
  #btn-restore:hover{ background:rgba(90,163,163,0.12); }
  #btn-write{ background:transparent; color:var(--gold); border:1px solid var(--gold); }
  #btn-write:hover{ background:rgba(201,169,97,0.12); }
  .bottom-bar button{ font-size:15px; letter-spacing:1px; }
  button:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  /* 寫入面板 */
  .wrow{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--panel-line); cursor:pointer; }
  .wrow:last-of-type{ border-bottom:none; }
  .wrow input{ width:20px; height:20px; accent-color:var(--gold); flex:0 0 auto; }
  .wrow .wn{ font-weight:700; font-size:15px; }
  .wrow .ws{ font-size:12px; color:var(--muted); line-height:1.6; word-break:break-all; }
  .wrow .ws.ok{ color:var(--teal); } .wrow .ws.err{ color:#d0665b; } .wrow .ws.done{ color:var(--gold); }
  .wopen{ margin-left:auto; color:var(--gold); font-size:13px; border:1px solid var(--gold-dim); padding:5px 10px; border-radius:6px; text-decoration:none; white-space:nowrap; }
  .wgo{ margin-top:12px; width:100%; padding:12px 0; border-radius:8px; border:1px solid var(--gold); background:var(--gold); color:var(--bg); font-family:inherit; font-size:15px; font-weight:700; letter-spacing:2px; cursor:pointer; }
  .wgo:disabled{ opacity:.4; }
  .wbar{ display:flex; gap:8px; margin:6px 0 10px; }
  .wbar .chip{ flex:1; padding:10px 0; }
  .wf label{ display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  .wf input[type=text],.wf input[type=password]{ width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--panel-line); background:var(--bg); color:var(--cream); font-size:14px; font-family:inherit; }
  .wf .two{ display:flex; gap:6px; } .wf .two input:first-child{ flex:3; } .wf .two input:last-child{ flex:2; }
  .wf .an{ font-weight:700; font-size:14px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>備份與恢復</h1>
    <p>勾選項目後按「開始備份」或「開始恢復」；要把備份寫進 GitHub 上的頁面，按「寫入GitHub」</p>
  </header>

  <div class="notes">
    <b>備份</b>：每個項目開啟一個分頁，自動下載備份檔後關閉。<br>
    <b>恢復</b>：先找到該項目的「一鍵備份」JSON 檔，在跳出的畫面中選擇它。<br>
    <b>寫入</b>：按「寫入GitHub」，選備份 JSON，按「確認寫入」即把資料直接寫進 GitHub 倉庫裡該頁面的 HTML，網址重新整理後就是新版（首次需到「設定」填權杖與倉庫）。<br>
    手機瀏覽器若提示「已封鎖快顯視窗」，請選擇允許。
  </div>

  <div class="toolbar">
    <div class="count">已選<b id="count">0</b>項</div>
    <div class="btns">
      <button class="chip" id="btn-select-all">全選</button>
      <button class="chip" id="btn-select-none">全不選</button>
    </div>
  </div>

  <div id="list"></div>
  <div id="status" class="result"></div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button id="btn-backup">開始備份</button>
    <button id="btn-restore">開始恢復</button>
    <button id="btn-write">寫入GitHub</button>
    <input type="file" id="w-file" accept=".json,application/json" multiple hidden>
  </div>
</div>

<script>
// file: 檔案名稱（需與本控制台放在同一個資料夾）
// supported: 該檔案是否已具備 autobackup / autorestore 網址參數機制
const APPS = [
  { id:'xrb',  name:'蕭氏學人班', file:'index-學人logo.html',   desc:'人員名單／出席記錄／生日', supported:true },
  { id:'ztm',  name:'張氏童蒙班', file:'index-童蒙logo.html', desc:'人員名單／出席記錄／學員資料', supported:true },
  { id:'xqs',  name:'蕭氏青少班', file:'index-青少logo.html',   desc:'人員名單／出席記錄／學員資料', supported:true },
  { id:'gs',   name:'公司排程系統', file:'index-公司logo.html', desc:'當月排程／盤點庫存／叫貨一覽表', supported:true },
  { id:'sb',   name:'三班報名系統', file:'index-三班logo.html', desc:'各班人員名單匯出／匯入', supported:true },
  { id:'th',   name:'茶會帳本', file:'index-茶會logo.html',     desc:'收支紀錄 JSON 備份／匯入', supported:true },
  { id:'cal',  name:'萬年曆', file:'萬年曆.html',              desc:'行事曆／例行班會／生日／特殊事項', supported:true },
  { id:'wildm', name:'戶外活動餐點彙整', file:'index-戶外-彙整.html', desc:'各區戶外活動餐點提供資料', supported:true },
  { id:'inv', name:'庫存盤點表', file:'index-庫存盤點logo.html', desc:'各分類品項清單／盤點數量', supported:true },
];

const listEl = document.getElementById('list');
APPS.forEach(app => {
  const row = document.createElement('label');
  row.className = 'row';
  row.innerHTML = `
    <input type="checkbox" data-id="${app.id}" ${app.supported ? 'checked' : 'disabled'}>
    <div class="badge"></div>
    <div class="info">
      <div class="name">${app.name}</div>
      <div class="desc">${app.desc}</div>
    </div>
    <div class="mark">${app.supported ? '已選' : '不支援'}</div>
  `;
  listEl.appendChild(row);
});

// 徽章文字：取名稱中最具辨識度的字（蕭氏學人班→學、張氏童蒙班→童…）
const BADGE = { xrb:'學', ztm:'童', xqs:'青', gs:'公', sb:'三', th:'茶', cal:'曆', wildm:'戶', inv:'庫' };
document.querySelectorAll('.badge').forEach((b, i) => { b.textContent = BADGE[APPS[i].id] || APPS[i].name.charAt(0); });

const boxes = () => [...document.querySelectorAll('input[type=checkbox]:not(:disabled)')];

function refresh(){
  document.getElementById('count').textContent = boxes().filter(c => c.checked).length;
  document.querySelectorAll('.row').forEach(r => {
    const c = r.querySelector('input');
    const m = r.querySelector('.mark');
    if (!c.disabled) m.textContent = c.checked ? '已選' : '未選';
  });
}
listEl.addEventListener('change', refresh);
refresh();

function getSelected(){
  return APPS.filter(a => a.supported && document.querySelector(`input[data-id="${a.id}"]`).checked);
}

document.getElementById('btn-select-all').onclick = () => { boxes().forEach(c => c.checked = true); refresh(); };
document.getElementById('btn-select-none').onclick = () => { boxes().forEach(c => c.checked = false); refresh(); };

function runBatch(action){
  const selected = getSelected();
  if (selected.length === 0) { alert('請至少勾選一個項目'); return; }
  const label = action === 'autobackup' ? '備份' : '恢復';

  // 不使用 window.open 批次開啟（手機瀏覽器通常會封鎖）。
  // 改為列出可點擊連結，每次點擊都是使用者的直接操作，不會被視為快顯視窗。
  const links = selected.map((app, i) =>
    `<a href="${app.file}?${action}=1" target="_blank" onclick="this.classList.add('done')">${i + 1}. ${app.name}</a>`
  ).join('');

  const tail = action === 'autobackup'
    ? '每個分頁會自動下載備份檔，完成後自動關閉。'
    : '請在每個分頁跳出的檔案選擇畫面中，選取該項目對應的備份 JSON 檔。';

  const s = document.getElementById('status');
  s.innerHTML = `<h2>${label}：共 ${selected.length} 項</h2><p>依序點擊下方連結，點過的項目顏色會變淡。</p>${links}<p class="tail">${tail}</p>`;
  s.classList.add('show');
  s.scrollIntoView({ behavior:'smooth', block:'center' });
}

document.getElementById('btn-backup').onclick = () => runBatch('autobackup');
document.getElementById('btn-restore').onclick = () => runBatch('autorestore');
// ===== 寫入 GitHub：把備份資料「烤」進倉庫裡的 HTML =====
// 做法：在 HTML 的 <head> 最前面放一小段程式，內含這份備份要寫入的資料；
// 頁面載入時若發現這是「新的一版」，就把資料寫進該頁面自己的儲存空間（每個版本每台裝置只寫一次）。
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
const keysN = o => isObj(o) ? Object.keys(o).length : 0;

function classWriter(appId, exportType, dataKey, recKey, bdFields) {
  return {
    appId,
    detect: p => p.exportType === exportType,
    count: p => `${p.members.length} 筆人員、${keysN(p.monthlyRecord)} 位學員出席記錄`,
    apply: (p, io) => {
      if (!Array.isArray(p.members) || !p.members.length) throw new Error('備份檔內找不到人員名單');
      const members = p.members.map(m => Object.assign({}, m, { familyOrder: m.familyOrder != null ? m.familyOrder : 1 }));
      if (appId === 'xrb') members.forEach((m, i) => { m.no = i + 1; });
      const d = { members, staffNames: p.staffNames || '', noBentoNames: p.noBentoNames || '' };
      bdFields.forEach(f => { d[f] = p[f] || {}; });
      io.set(dataKey, d);
      if (isObj(p.monthlyRecord)) io.set(recKey, p.monthlyRecord);
    }
  };
}

// io.set：直接覆蓋該 key；io.merge：按日期合併進現有資料
const WRITERS = [
  { appId:'inv', detect: p => p.app === 'inventory-count-backup',
    count: p => Object.values(p.data || {}).reduce((s, v) => s + (Array.isArray(v) ? v.length : 0), 0) + ' 筆品項',
    apply: (p, io) => { if (!isObj(p.data)) throw new Error('備份檔內沒有 data 欄位');
      io.set('inventory_count_state_v1', { v:1, time:new Date().toISOString(), data:p.data });
      io.set('inventory_count_backup_v1', { time:p.time, data:p.data }); } },

  classWriter('xrb', 'xrb_full_backup', 'xrb_data_v2',  'xrb_monthly_record_v1', ['memberBirthdayExtra']),
  classWriter('xqs', 'qsb_full_backup', 'qsb_data',     'qsb_monthly_record_v1', ['studentBirthdayExtra', 'parentBirthdayExtra']),
  classWriter('ztm', 'tmb_full_backup', 'tmb_data_main','tmb_monthly_record_v1', ['studentBirthdayExtra', 'parentBirthdayExtra']),

  { appId:'sb', detect: p => p.type === 'sanban_roster_export',
    count: p => keysN(p.data) + ' 組名單資料',
    apply: (p, io) => { if (!isObj(p.data)) throw new Error('備份檔內沒有 data 欄位'); io.set('sanban_roster_state_v1', p.data); } },

  // 茶會帳本的備份檔沒有標記，以內容（members + records，且不是班級備份）判斷
  { appId:'th', detect: p => Array.isArray(p.members) && Array.isArray(p.records) && !p.exportType,
    count: p => `${p.members.length} 位成員、${p.records.length} 筆收支`,
    apply: (p, io) => { io.set('tea-ledger-data', p); } },

  { appId:'cal', detect: p => p.type === 'calendar-backup',
    count: p => `行事曆 ${keysN(p.events)} 天、例行 ${(p.routines || []).length}、生日 ${(p.birthdays || []).length}、特殊 ${(p.specials || []).length}`,
    apply: (p, io) => {
      io.set('calendar-events-v1', isObj(p.events) ? p.events : {});
      io.set('calendar-routines-v1', Array.isArray(p.routines) ? p.routines : []);
      io.set('calendar-birthdays-v1', Array.isArray(p.birthdays) ? p.birthdays : []);
      io.set('calendar-specials-v1', Array.isArray(p.specials) ? p.specials : []);
    } },

  // 公司排程系統：備份只含當月＋下月，因此按日期合併，不會清掉其他月份
  { appId:'gs', detect: p => p.type === 'der-life-full-monthly-backup',
    count: p => `排程 ${keysN(p.schedule)} 天、盤點欄位 ${keysN(p.inventory)} 個、叫貨 ${keysN(p.orderSched)} 天（${p.year}年${p.month}月起）`,
    apply: (p, io) => {
      io.merge('schedule_v2', p.schedule || {});
      io.merge('order_sched_v1', p.orderSched || {});
      io.merge('order_arrival_v1', p.orderArrival || {});
      Object.keys(p.inventory || {}).forEach(id => io.set('inp_' + id, String(p.inventory[id])));
    } },
];

const UNSUPPORTED = [
  { detect: p => p.type === 'meal-entries-backup', why:'戶外活動餐點彙整的資料不是存在瀏覽器裡，無法用這個方式寫入' },
];

// ---- 產生要插入 HTML 的區塊 ----
const EMB_START = '<!--EMB-BACKUP-START-->', EMB_END = '<!--EMB-BACKUP-END-->';
const makeIO = () => { const set = {}, merge = {};
  return { set:(k, v) => { set[k] = typeof v === 'string' ? v : JSON.stringify(v); },
           merge:(k, o) => { merge[k] = Object.assign(merge[k] || {}, o); }, out:{ set, merge } }; };
function makeBlock(id, out){
  const E = { id, t:new Date().toISOString(), set:out.set, merge:out.merge };
  const json = JSON.stringify(E).replace(/</g, '\\u003c').replace(/\u2028|\u2029/g, '');
  return EMB_START + '<script>(function(){try{var E=' + json + ';var mk="emb_applied_"+E.id;if(localStorage.getItem(mk)===E.t)return;var k,d,o,s;for(k in E.set)localStorage.setItem(k,E.set[k]);for(k in E.merge){o={};try{o=JSON.parse(localStorage.getItem(k))||{}}catch(e){}s=E.merge[k];for(d in s)o[d]=s[d];localStorage.setItem(k,JSON.stringify(o))}localStorage.setItem(mk,E.t)}catch(e){}})();<\/script>' + EMB_END;
}
function inject(html, block){
  const re = new RegExp(EMB_START + '[\\s\\S]*?' + EMB_END);
  if (re.test(html)) return html.replace(re, () => block);
  const m = html.match(/<head[^>]*>/i);
  if (!m) throw new Error('HTML 內找不到 <head>');
  return html.replace(m[0], () => m[0] + '\n' + block);
}

// ---- GitHub 設定（存在本機瀏覽器）----
const CFG_KEY = 'bk_github_cfg_v1';
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) {}
cfg.token = cfg.token || ''; cfg.apps = cfg.apps || {};
if (!cfg.apps.xqs) cfg.apps.xqs = { repo:'amoschou6438-oss/Young-class', path:'index.html' };
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} };
const WAPPS = WRITERS.map(w => w.appId).filter((v, i, a) => a.indexOf(v) === i).map(id => APPS.find(a => a.id === id));
const ready = id => cfg.apps[id] && /^[^\/\s]+\/[^\/\s]+$/.test(cfg.apps[id].repo || '') && (cfg.apps[id].path || '').trim();

const gh = (path, opt = {}) => fetch('https://api.github.com' + path, Object.assign({}, opt, { headers:Object.assign({ Authorization:'Bearer ' + cfg.token, 'X-GitHub-Api-Version':'2022-11-28' }, opt.headers || {}) }));
const httpMsg = st => st === 401 ? '權杖無效或已過期' : st === 403 ? '權杖權限不足（需要該倉庫的 Contents 讀寫權限）' : st === 404 ? '找不到倉庫或檔案，或權杖沒有該倉庫的權限' : (st === 409 || st === 422) ? '檔案剛被更改，請重試' : 'GitHub 回應錯誤 ' + st;
function b64(str){ const u = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); }
const pagesUrl = repo => { const [o, n] = repo.split('/'); return n.toLowerCase() === (o + '.github.io').toLowerCase() ? `https://${o}.github.io/` : `https://${o}.github.io/${n}/`; };

async function bakeOne(it){
  const c = cfg.apps[it.app.id];
  const cp = '/repos/' + c.repo + '/contents/' + c.path.trim().split('/').map(encodeURIComponent).join('/');
  const meta = await gh(cp, { headers:{ Accept:'application/vnd.github.object+json' } });
  if (!meta.ok) throw new Error(httpMsg(meta.status));
  const mj = await meta.json();
  if (!mj || mj.type !== 'file') throw new Error('路徑不是檔案，請檢查設定');
  const raw = await gh(cp, { headers:{ Accept:'application/vnd.github.raw+json' } });
  if (!raw.ok) throw new Error(httpMsg(raw.status));
  const old = await raw.text();
  const io = makeIO(); it.w.apply(it.payload, io);
  const next = inject(old, makeBlock(it.app.id, io.out));
  const put = await gh(cp, { method:'PUT', headers:{ Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
    body:JSON.stringify({ message:`自動寫入備份資料（${it.app.name}）`, content:b64(next), sha:mj.sha }) });
  if (!put.ok) throw new Error(httpMsg(put.status));
}

// ---- 畫面 ----
let wItems = [], showSet = false;
const fmtT = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const payloadTime = p => Date.parse(p.time || p.exportDate || p.exportedAt) || 0;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

document.getElementById('btn-write').onclick = () => { showSet = !cfg.token; renderWrite(); };
document.getElementById('w-file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  const best = {}, bad = [];
  for (const f of files) {
    try {
      const p = JSON.parse(await f.text());
      if (!isObj(p)) throw new Error('不是有效的備份檔');
      const un = UNSUPPORTED.find(u => u.detect(p));
      if (un) throw new Error(un.why);
      const w = WRITERS.find(w => w.detect(p));
      if (!w) throw new Error('無法辨識這是哪一個項目的備份');
      const t = payloadTime(p);
      if (!best[w.appId] || t > best[w.appId].t) best[w.appId] = { w, app:APPS.find(a => a.id === w.appId), fileName:f.name, payload:p, t };
    } catch (err) { bad.push({ fileName:f.name, error:err.message }); }
  }
  wItems = Object.values(best).map(b => { let c = ''; try { c = b.w.count(b.payload); } catch (e) {} return Object.assign({}, b, { count:c }); }).concat(bad);
  showSet = false; renderWrite();
};

function renderWrite(){
  const s = document.getElementById('status');
  let h = `<h2>寫入 GitHub</h2><div class="wbar"><button class="chip" id="w-pick">選擇備份檔</button><button class="chip" id="w-set">⚙ 設定</button></div>`;
  if (showSet) {
    h += `<div class="wf"><p style="margin:0 0 4px">權杖與倉庫只存在這支手機的瀏覽器裡。權杖請建立「Fine-grained」，只勾要更新的倉庫，權限 Contents 設為 Read and write。</p>
      <label>GitHub 權杖</label><input type="password" id="f-token" value="${esc(cfg.token)}" autocomplete="off">`;
    WAPPS.forEach(a => { const c = cfg.apps[a.id] || {};
      h += `<div class="an">${a.name}</div><div class="two"><input type="text" data-r="${a.id}" placeholder="帳號/倉庫名" value="${esc(c.repo || '')}"><input type="text" data-p="${a.id}" placeholder="檔案路徑" value="${esc(c.path || 'index.html')}"></div>`; });
    h += `<button class="wgo" id="f-save">儲存設定</button></div>`;
  } else if (wItems.length) {
    const ok = wItems.filter(i => !i.error).length;
    h += `<p style="margin:0 0 4px">辨識到 ${ok} 項</p>`;
    wItems.forEach((it, i) => {
      if (it.error) { h += `<div class="wrow" style="cursor:default"><div><div class="wn">${esc(it.fileName)}</div><div class="ws err" id="ws-${i}">${esc(it.error)}</div></div></div>`; return; }
      const r = ready(it.app.id);
      h += `<label class="wrow"><input type="checkbox" data-wi="${i}" ${r ? 'checked' : 'disabled'}><div><div class="wn">${it.app.name}</div>
        <div class="ws ok" id="ws-${i}">${esc(it.fileName)}<br>${fmtT(it.t) ? '備份時間 ' + fmtT(it.t) + '，' : ''}${esc(it.count)}<br>${r ? '→ ' + esc(cfg.apps[it.app.id].repo) + '／' + esc(cfg.apps[it.app.id].path) : '<span style="color:#d0665b">尚未設定倉庫，請按「設定」</span>'}</div></div></label>`;
    });
    if (ok) h += `<button class="wgo" id="w-go">確認寫入 GitHub</button><p class="tail">會直接修改 GitHub 倉庫裡的 HTML（留下一筆提交，可在 GitHub 還原）。網站約 1～2 分鐘後更新；每台裝置第一次打開新版時，會用這份備份取代該頁面原有資料。</p>`;
  } else h += `<p class="tail">先按「選擇備份檔」，可一次選多個 JSON。</p>`;
  s.innerHTML = h; s.classList.add('show');
  s.scrollIntoView({ behavior:'smooth', block:'center' });
  document.getElementById('w-pick').onclick = () => document.getElementById('w-file').click();
  document.getElementById('w-set').onclick = () => { showSet = !showSet; renderWrite(); };
  const sv = document.getElementById('f-save');
  if (sv) sv.onclick = () => {
    cfg.token = document.getElementById('f-token').value.trim();
    WAPPS.forEach(a => { cfg.apps[a.id] = { repo:document.querySelector(`[data-r="${a.id}"]`).value.trim(), path:document.querySelector(`[data-p="${a.id}"]`).value.trim() || 'index.html' }; });
    saveCfg(); showSet = false; renderWrite();
  };
  const go = document.getElementById('w-go');
  if (go) go.onclick = doWrite;
}

async function doWrite(){
  if (!cfg.token) { alert('請先到「設定」填入 GitHub 權杖'); return; }
  const sel = [...document.querySelectorAll('input[data-wi]:checked')].map(c => +c.dataset.wi);
  if (!sel.length) { alert('請至少勾選一個項目'); return; }
  if (!confirm(`即將修改 GitHub 上 ${sel.length} 個頁面的 HTML，確定嗎？`)) return;
  const go = document.getElementById('w-go'); go.disabled = true;
  for (const i of sel) {
    const it = wItems[i], st = document.getElementById('ws-' + i);
    st.className = 'ws'; st.textContent = '寫入中…';
    try {
      await bakeOne(it);
      st.className = 'ws done';
      st.innerHTML = `✓ 已更新 GitHub（${esc(it.count)}） <a class="wopen" href="${pagesUrl(cfg.apps[it.app.id].repo)}" target="_blank">開啟網站</a>`;
    } catch (err) { st.className = 'ws err'; st.textContent = '✗ 寫入失敗：' + err.message; }
  }
  go.disabled = false;
}
</script>
